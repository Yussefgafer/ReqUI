name: Build and Release APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validation:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # AGP 9.2.1 requires JDK 21+.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          generate-job-summary: true
          gradle-home-cache-cleanup: true

      - name: Run Lint
        run: ./gradlew lintDebug --build-cache --continue

  build:
    name: Build APK
    # Runs in parallel with `validation` so the APK is not blocked by lint.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          generate-job-summary: true
          gradle-home-cache-cleanup: true

      # Decode the release keystore from the KEYSTORE_BASE64 secret (never committed).
      # If the secret is absent, release signing is skipped and only debug is built.
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding keystore..."
            echo -n "$KEYSTORE_BASE64" | base64 -d > app/requi.jks
          else
            echo "KEYSTORE_BASE64 is missing. Release signing will be skipped."
          fi

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --build-cache

      - name: Build Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --build-cache

      - name: Get version name
        id: version_info
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare artifacts
        run: |
          mkdir -p build-artifacts
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-artifacts/ReqUI-Release-${{ steps.version_info.outputs.version_name }}.apk
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ReqUI-Builds
          path: build-artifacts/*.apk
          retention-days: 7

  release:
    name: GitHub Release
    permissions:
      contents: write
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && secrets.KEYSTORE_BASE64 != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ReqUI-Builds
          path: .

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="v$VERSION" '
            /^# v[0-9]/ {
              h = $2
              if (active) exit
              if (h == ver) active=1
              next
            }
            active { print }
          ' changelog.md > release_body.md
          echo "Written $(wc -l < release_body.md) lines"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          body_path: release_body.md
          files: |
            ReqUI-Release-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
